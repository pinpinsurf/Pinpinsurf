function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleOptions(q) {
  const indexed = q.options.map((opt, i) => ({
    opt,
    note: q.optionNotes[i],
    isCorrect: i === q.answer,
  }));
  const shuffled = shuffle(indexed);
  return {
    ...q,
    options: shuffled.map(x => x.opt),
    optionNotes: shuffled.map(x => x.note),
    answer: shuffled.findIndex(x => x.isCorrect),
  };
}

  return RESULT_TIERS.find(t => pct >= t.min);
}

  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [expandedNote, setExpandedNote] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [finished, setFinished] = useState(false);
  const [wrongLog, setWrongLog] = useState([]);
  const [showIntro, setShowIntro] = useState(true);
  const [musicOn, setMusicOn] = useState(false);
  const audioRef = React.useRef(null);

  function startMusic() {
    const a = audioRef.current;
    if (a) {
      a.volume = 0.35;
      a.play().then(() => setMusicOn(true)).catch(() => setMusicOn(false));
    }
  }

  function toggleMusic() {
    const a = audioRef.current;
    if (!a) return;
    if (musicOn) {
      a.pause();
      setMusicOn(false);
    } else {
      a.volume = 0.35;
      a.play().then(() => setMusicOn(true)).catch(() => {});
    }
  }

  useEffect(() => {
    setQuestions(shuffle(ALL_QUESTIONS).map(shuffleOptions));
  }, []);

  const q = questions[current];
  const total = questions.length;
  const pct = total ? Math.round((score / total) * 100) : 0;

    if (revealed) {
      // After reveal, tapping any option toggles its note
      setExpandedNote(expandedNote === idx ? null : idx);
      return;
    }
    setSelected(idx);
    setRevealed(true);
    setExpandedNote(idx); // auto-expand the chosen option's note
    if (idx === q.answer) {

    } else {

        q: q.q, correct: q.options[q.answer],
        you: q.options[idx], category: q.category

    }

    if (current + 1 >= questions.length) {

      setExpandedNote(null);

        )}

        {revealed && (
          <button onClick={handleNext} style={{
            width: "100%", padding: "13px", background: "transparent",
            border: "1px solid rgba(180,160,130,0.12)", borderRadius: 2,
            color: "#6a5a42", fontSize: 11, cursor: "pointer", letterSpacing: "0.15em",
          }}>
            {current + 1 >= total ? "查看結果" : "繼續"}
          </button>
        )}
      </div>
      <style>{`@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </div>
  );

  })();

  return (
    <React.Fragment>
      <audio ref={audioRef} src="bgm.mp3" loop preload="auto" />
      {!showIntro && muteBtn}
      {screen}
    </React.Fragment>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SpiritualQuiz />);
</script>
</body>
</html>
